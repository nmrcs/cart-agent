services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: cart_agent
    ports:
      - '5432:5432'
    volumes:
      # 18+ keeps PGDATA under /var/lib/postgresql/<major>; mount the parent.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U shop -d cart_agent']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
